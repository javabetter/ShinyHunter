plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

// ------------------------------------------------------------------------------ build constants
// Where the mod gets player data from: the Shiny Hunter API, a small proxy that holds the Hypixel
// API key so the mod never ships one. Set in gradle.properties.
def modDisplayName = "Shiny Hunter"
def apiProxyUrl = (findProperty("api_proxy_url") ?: "").toString().trim().replaceAll('/+$', '')

def generatedEditionDir = layout.buildDirectory.dir("generated/edition")
tasks.register("generateEdition") {
	inputs.property "apiProxyUrl", apiProxyUrl
	outputs.dir generatedEditionDir
	doLast {
		def file = generatedEditionDir.get().file("com/shinyhunter/Edition.java").asFile
		file.parentFile.mkdirs()
		file.text = """package com.shinyhunter;

/** Generated by build.gradle. Do not edit; do not commit. */
public final class Edition {
    public static final String NAME = "${modDisplayName}";
    /** The Shiny Hunter API proxy. Empty disables every player-data lookup. */
    public static final String PROXY_URL = "${apiProxyUrl}";

    private Edition() {
    }
}
"""
	}
}
sourceSets.main.java.srcDir generatedEditionDir
tasks.withType(JavaCompile).configureEach { dependsOn "generateEdition" }
tasks.withType(Jar).configureEach { dependsOn "generateEdition" }

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom automatically adds the Mojang/Fabric repos needed to fetch Minecraft itself.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	// MoulConfig: the config-screen library Firmament (and NEU) draw their settings with.
	maven {
		name = "NotEnoughUpdates"
		url = "https://maven.notenoughupdates.org/releases"
	}
	mavenCentral() // Kotlin's stdlib, needed only to compile against MoulConfig's Kotlin signatures
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// ModMenu is gone: the settings screen is reached with /shiny, and every setting is published
	// to JARVIS (see compat/JarvisIntegration) so Firmament's /jarvis options can search and open
	// them. The JARVIS API is compiled against local stubs, so there is no dependency to declare.

	// Bundled with `include` (jar-in-jar) rather than required as a separate download: MoulConfig
	// is a library, not a mod anyone installs on purpose, and Firmament shades its own copy into a
	// relocated package that other mods can't use.
	implementation "org.notenoughupdates.moulconfig:modern-26.1:${project.moulconfig_version}"
	include "org.notenoughupdates.moulconfig:modern-26.1:${project.moulconfig_version}"

	// MoulConfig is written in Kotlin. The stdlib is only needed to resolve its signatures at
	// compile time; at runtime it comes from Fabric Language Kotlin, which the mod now requires
	// (as does every other MoulConfig user, Firmament included).
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
	runtimeOnly "net.fabricmc:fabric-language-kotlin:${project.flk_version}"

	// No `mappings` block: starting with 26.x, Minecraft ships unobfuscated, so there's no
	// separate Mojang mapping file to fetch — Loom uses the jar's own names directly. Since
	// mods on this version are unobfuscated too, the mod*/plain dependency distinction (which
	// existed to trigger remapping) no longer applies — plain implementation/compileOnly work.

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// The JARVIS API stubs exist only to compile against — see the package docs in
// moe/nea/jarvis/api. At runtime the real classes come from whichever mod provides JARVIS, and
// shipping a duplicate copy could shadow it, so they are kept out of the jar.
jar {
	exclude 'moe/**'
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "name": modDisplayName
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// Pinned rather than left to the platform default: the chat strings contain § colour codes and
	// a ✨, which a non-UTF-8 default would silently mangle into garbage in-game.
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Release jar naming: "ShinyHunter v<mod_version> <minecraft_version>.jar" instead of Gradle's
// default "<archivesBaseName>-<version>.jar", so downloaded files are self-explanatory about
// which Minecraft version they target. Matches whichever archive task actually produces the
// final build/libs output, whether or not remapping is involved.
def releaseFileBaseName = "${modDisplayName.replace(' ', '')} v${project.mod_version} ${project.minecraft_version}"
tasks.withType(AbstractArchiveTask).configureEach { task ->
	if (task.name == "jar" || task.name == "remapJar") {
		task.archiveFileName.set("${releaseFileBaseName}.jar")
	} else if (task.name == "sourcesJar" || task.name == "remapSourcesJar") {
		task.archiveFileName.set("${releaseFileBaseName}-sources.jar")
	}
}
