# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache on this Loom version, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft / Fabric — this is the ONLY block you need to touch to port to a newer version.
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17.17
fabric_api_version=0.155.2+26.1.2
moulconfig_version=4.7.2
kotlin_version=2.4.20
flk_version=1.14.1+kotlin.2.4.20

# Mod properties
mod_version=2.1
maven_group=com.shinyhunter
archives_base_name=shinyhunter

# The Shiny Hunter API: holds the Hypixel API key so the mod never ships one. No trailing slash.
api_proxy_url=https://shinyhunter-api.shinyhunter-api.workers.dev
